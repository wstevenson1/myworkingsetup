[defaults]
inventory = inventory/hosts
# 10s (the default) is too tight for the first sudo on a fresh host,
# which can stall on hostname resolution and trip 'Timed out waiting
# for become success'.
timeout = 30
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
forks = 10
deprecation_warnings = False
command_warnings = False

[ssh_connection]
pipelining = True
