[defaults]
inventory = inventory/hosts
# 10s (the default) is too tight for the first sudo on a fresh host,
# which can stall on hostname resolution and trip 'Timed out waiting
# for become success'.
timeout = 30
host_key_checking = False
retry_files_enabled = False
# `stdout_callback = yaml` resolved to community.general.yaml, removed in
# that collection's 12.0.0. The built-in default callback does the same
# thing via result_format.
stdout_callback = default
result_format = yaml
forks = 10
deprecation_warnings = False
command_warnings = False

[ssh_connection]
pipelining = True
