- name: Bootstrap dev environment
  hosts: local
  connection: local
  become: yes
  gather_facts: yes
  vars:
    common_packages:
      - git
      - python3
      - python3-pip
      - curl
      - wget
      - unzip
      - rsync
      - ca-certificates
      - bash-completion
      - jq
      - sqlite3
      # 'locales' is Debian-specific; moved to Debian-only packages below
    debian_extra_packages:
      - python3-apt
      - python3-venv
      - openssh-server
      - postgresql-client
      - postgresql-contrib
      - locales
    redhat_extra_packages:
      - openssh-server
      - postgresql-server
      - postgresql
      - postgresql-contrib
      - which
      - man-db
    debian_brew_packages:
      - build-essential
      - procps
      - file
      - git
      - curl
      - ruby
      - python3
    redhat_brew_packages:
      - gcc
      - gcc-c++
      - make
      - tar
      - file
      - git
      - curl
      - ruby
      - python3
  tasks:
    - name: Ensure apt cache is up to date
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts.os_family == 'Debian'

    - name: Ensure dnf cache is up to date
      dnf:
        update_cache: yes
      when: ansible_facts.os_family == 'RedHat'

    - name: Ensure Linuxbrew build dependencies are installed
      package:
        name: "{{ debian_brew_packages if ansible_facts.os_family == 'Debian' else redhat_brew_packages }}"
        state: present
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Install common packages
      package:
        name: "{{ common_packages + (debian_extra_packages if ansible_facts.os_family == 'Debian' else redhat_extra_packages) }}"
        state: present

    - name: Set Homebrew user
      set_fact:
        homebrew_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"

    # Homebrew on Linux installs to /home/linuxbrew/.linuxbrew no matter what
    # prefix it is asked for, and only ships bottles for that path. Pointing
    # anywhere else leaves brew unfindable and every formula building from
    # source.
    - name: Set Homebrew prefix
      set_fact:
        homebrew_prefix: /home/linuxbrew/.linuxbrew

    - name: Ensure Homebrew prefix directory exists
      file:
        path: "{{ homebrew_prefix }}"
        state: directory
        mode: '0755'
        owner: "{{ homebrew_user }}"
        group: "{{ homebrew_user }}"

    - name: Install Homebrew on Linux if missing
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
      environment:
        CI: "1"
        NONINTERACTIVE: "1"
        HOME: "/home/{{ homebrew_user }}"

    - name: Verify brew exists and is functional
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: "{{ homebrew_prefix }}/bin/brew --version"
      register: brew_check
      failed_when: false
      changed_when: false

    - name: Re-run Homebrew installer if brew missing
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
      when: brew_check.rc != 0
      register: brew_install_again
      failed_when: false

    - name: Debug Homebrew installer output on failure
      debug:
        msg: "Homebrew installer stdout: {{ brew_install_again.stdout }} stderr: {{ brew_install_again.stderr }}"
      # A skipped task registers {changed: false, skipped: true} with no 'rc'.
      # ansible-core 2.21 raises on the missing attribute instead of
      # treating it as falsy, so default it.
      when: brew_install_again is defined and (brew_install_again.rc | default(0)) != 0

    # Installed one at a time: `brew install a b c` aborts the entire batch if
    # any single formula is unavailable on Linux, and this list was captured on
    # macOS. Looping in the remote shell rather than with Ansible's `loop`
    # avoids 769 round trips. Full output goes to ~/brew-install.log; only the
    # names that failed come back in stdout.
    - name: Ensure Homebrew CLI formulae are installed
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        brew_bin="{{ homebrew_prefix }}/bin/brew"
        log="$HOME/brew-install.log"
        : > "$log"
        failed=""
        chunk=""
        n=0
        # Install in chunks for speed, then retry a failed chunk member by
        # member so one Linux-unavailable formula does not lose the other 24.
        # </dev/null is required: brew inherits stdin from the while loop,
        # which is the formulae file, and drains the remaining lines.
        flush() {
          [ -z "$chunk" ] && return 0
          if ! $brew_bin install $chunk >>"$log" 2>&1 </dev/null; then
            for f in $chunk; do
              if ! $brew_bin install "$f" >>"$log" 2>&1 </dev/null; then
                failed="$failed $f"
              fi
            done
          fi
          chunk=""
          n=0
        }
        while IFS= read -r formula || [ -n "$formula" ]; do
          formula="$(echo "$formula" | tr -d '[:space:]')"
          [ -z "$formula" ] && continue
          case "$formula" in \#*) continue ;; esac
          chunk="$chunk $formula"
          n=$((n+1))
          [ "$n" -ge 25 ] && flush
        done < "{{ playbook_dir }}/homebrew_formulae.txt"
        flush
        [ -n "$failed" ] && echo "FAILED_FORMULAE:$failed"
        exit 0
      args:
        chdir: "{{ playbook_dir }}"
        executable: /bin/bash
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
        # Each brew invocation otherwise fires an analytics HTTP call and may
        # trigger a git auto-update fetch; both dominate runtime over hundreds
        # of installs.
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      register: brew_formulae
      changed_when: true

    - name: Report Homebrew formulae that failed to install
      debug:
        msg: >-
          {{ brew_formulae.stdout | regex_replace('^.*FAILED_FORMULAE:', '') | trim }}
          (see ~/brew-install.log)
      when: "'FAILED_FORMULAE:' in (brew_formulae.stdout | default(''))"

    - name: Try install PostgreSQL 14 on Debian/Ubuntu
      apt:
        name: postgresql-14
        state: present
      when: ansible_facts.os_family == 'Debian'
      register: postgresql_14_install
      failed_when: false

    - name: Ensure default PostgreSQL is installed on Debian/Ubuntu if 14 is unavailable
      apt:
        name:
          - postgresql
          - postgresql-client
          - postgresql-contrib
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - postgresql_14_install is failed

    - name: Create user-local bin directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
      loop:
        - "{{ ansible_env.HOME }}/.local/bin"
        - "{{ ansible_env.HOME }}/.programs"
        - "{{ ansible_env.HOME }}/.logs"

    - name: Copy bash aliases
      copy:
        src: files/aliases
        dest: "{{ ansible_env.HOME }}/.aliases"
        backup: yes
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0644'

    - name: Copy bash history sqlite helper
      copy:
        src: files/bash-history-sqlite.sh
        dest: "{{ ansible_env.HOME }}/.bash-history-sqlite.sh"
        backup: yes
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0755'

    - name: Deploy portable bashrc
      template:
        src: files/bashrc.j2
        dest: "{{ ansible_env.HOME }}/.bashrc"
        backup: yes
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0644'

    - name: Deploy portable bash_profile
      template:
        src: files/bash_profile.j2
        dest: "{{ ansible_env.HOME }}/.bash_profile"
        backup: yes
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0644'

    - name: Ensure HISTDB exists
      file:
        path: "{{ ansible_env.HOME }}/.hist.db"
        state: touch
        mode: '0600'
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"

    - name: Ensure bash-preexec helper is installed
      get_url:
        url: https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh
        dest: "{{ ansible_env.HOME }}/.bash-preexec.sh"
        mode: '0755'

    - name: Ensure SSH run directory exists
      file:
        path: /var/run/sshd
        state: directory
        mode: '0755'

    - name: Ensure ssh host keys are present
      command: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Ensure sshd listens on port 2222
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: '# {mark} ANSIBLE MANAGED PORT 2222'
        block: |
          Port 2222
          PasswordAuthentication yes
          PermitRootLogin prohibit-password
          UsePAM yes
          ChallengeResponseAuthentication no
      notify: restart sshd

    - name: Start and enable SSH service
      service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: yes

    # RHEL ships postgresql-server with an uninitialized data dir; the unit
    # refuses to start until postgresql-setup --initdb has run. Debian's
    # packaging creates a cluster on install, so this is RedHat-only.
    - name: Initialize PostgreSQL data directory on RedHat
      command: /usr/bin/postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION
      when: ansible_facts.os_family == 'RedHat'

    - name: Start PostgreSQL service
      service:
        name: postgresql
        state: started
        enabled: yes
      when: ansible_facts.os_family == 'Debian' or ansible_facts.os_family == 'RedHat'

    - name: Install ansible package via pip if ansible is missing
      pip:
        name: ansible
        executable: /usr/bin/pip3
      when: ansible_facts.os_family == 'Debian' or ansible_facts.os_family == 'RedHat'

  handlers:
    - name: restart sshd
      service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: restarted
