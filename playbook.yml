- name: Bootstrap dev environment
  hosts: local
  connection: local
  become: yes
  gather_facts: yes
  vars:
    common_packages:
      - git
      - python3
      - python3-pip
      - curl
      - wget
      - unzip
      - rsync
      - ca-certificates
      - bash-completion
      - jq
      - sqlite3
      - tmux
      # ansible's pip module imports 'packaging' as root; a pip --user
      # install of ansible puts it in the user site-packages only.
      - python3-packaging
      # 'locales' is Debian-specific; moved to Debian-only packages below
    debian_extra_packages:
      - python3-apt
      - python3-venv
      # Python.h etc., so pip can build C-extension packages that ship no wheel
      # (see roles/language_packages/ and python_packages_skip.txt).
      - python3-dev
      # oniguruma.h, for the onigurumacffi wheel (pulled in by ansible-navigator).
      - libonig-dev
      - openssh-server
      - postgresql-client
      - postgresql-contrib
      - locales
      # ~/.tmux.conf sets lock-command vlock; without it every lock-session
      # and every lock-after-time expiry errors out. Debian ships it as its
      # own package, RedHat folds it into kbd.
      - vlock
    redhat_extra_packages:
      - openssh-server
      - postgresql-server
      - postgresql
      - postgresql-contrib
      - which
      - man-db
      # Python.h etc., so pip can build C-extension packages that ship no wheel
      # (see roles/language_packages/ and python_packages_skip.txt).
      - python3-devel
      # oniguruma.h, for the onigurumacffi wheel (pulled in by ansible-navigator).
      - oniguruma-devel
      # provides vlock; see the Debian list above
      - kbd
    debian_brew_packages:
      - build-essential
      - procps
      - file
      - git
      - curl
      - ruby
      - python3
    redhat_brew_packages:
      - gcc
      - gcc-c++
      - make
      - tar
      - file
      - git
      - curl
      - ruby
      - python3
  tasks:
    - name: Ensure apt cache is up to date
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts.os_family == 'Debian'

    - name: Ensure dnf cache is up to date
      dnf:
        update_cache: yes
      when: ansible_facts.os_family == 'RedHat'

    # oniguruma-devel (in redhat_extra_packages) ships only in CRB, which is
    # disabled by default on CentOS Stream / Rocky / Alma. Enabling it is
    # idempotent (changed_when: false); failed_when: false so this is a no-op
    # on Fedora, which has no separate CRB repo.
    - name: Enable the CRB repository on RedHat
      command: dnf config-manager --set-enabled crb
      changed_when: false
      failed_when: false
      when: ansible_facts.os_family == 'RedHat'

    - name: Ensure Linuxbrew build dependencies are installed
      package:
        name: "{{ debian_brew_packages if ansible_facts.os_family == 'Debian' else redhat_brew_packages }}"
        state: present
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Install common packages
      package:
        name: "{{ common_packages + (debian_extra_packages if ansible_facts.os_family == 'Debian' else redhat_extra_packages) }}"
        state: present

    - name: Set Homebrew user
      set_fact:
        homebrew_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"

    # Homebrew on Linux installs to /home/linuxbrew/.linuxbrew no matter what
    # prefix it is asked for, and only ships bottles for that path. Pointing
    # anywhere else leaves brew unfindable and every formula building from
    # source.
    - name: Set Homebrew prefix
      set_fact:
        homebrew_prefix: /home/linuxbrew/.linuxbrew

    # The play runs with become: yes, so ansible_env is root's environment and
    # ansible_env.HOME/.USER resolve to /root and root. Every task that writes
    # into the invoking user home must use these facts instead.
    - name: Look up the target user account
      getent:
        database: passwd
        key: "{{ homebrew_user }}"

    - name: Set target user and home
      set_fact:
        target_user: "{{ homebrew_user }}"
        target_home: "{{ getent_passwd[homebrew_user][4] }}"

    - name: Ensure Homebrew prefix directory exists
      file:
        path: "{{ homebrew_prefix }}"
        state: directory
        mode: '0755'
        owner: "{{ homebrew_user }}"
        group: "{{ homebrew_user }}"

    - name: Install Homebrew on Linux if missing
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
      environment:
        CI: "1"
        NONINTERACTIVE: "1"
        HOME: "/home/{{ homebrew_user }}"

    - name: Verify brew exists and is functional
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: "{{ homebrew_prefix }}/bin/brew --version"
      register: brew_check
      failed_when: false
      changed_when: false

    - name: Re-run Homebrew installer if brew missing
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
      when: brew_check.rc != 0
      register: brew_install_again
      failed_when: false

    - name: Debug Homebrew installer output on failure
      debug:
        msg: "Homebrew installer stdout: {{ brew_install_again.stdout }} stderr: {{ brew_install_again.stderr }}"
      # A skipped task registers {changed: false, skipped: true} with no 'rc'.
      # ansible-core 2.21 raises on the missing attribute instead of
      # treating it as falsy, so default it.
      when: brew_install_again is defined and (brew_install_again.rc | default(0)) != 0

    # Installed one at a time: `brew install a b c` aborts the entire batch if
    # any single formula is unavailable on Linux, and this list was captured on
    # macOS. Looping in the remote shell rather than with Ansible's `loop`
    # avoids 769 round trips. Full output goes to ~/brew-install.log; only the
    # names that failed come back in stdout.
    - name: Ensure Homebrew CLI formulae are installed
      become: yes
      become_user: "{{ homebrew_user }}"
      shell: |
        brew_bin="{{ homebrew_prefix }}/bin/brew"
        log="$HOME/brew-install.log"
        : > "$log"
        failed=""
        chunk=""
        n=0
        skipped=0
        wanted=0
        # Ask brew once what is already present, rather than invoking it per
        # formula only to learn it has nothing to do. Leading/trailing spaces
        # let the membership test below match whole names only.
        installed=" $($brew_bin list --formula 2>/dev/null | tr "\n" " ") "
        # Formulae known to be uninstallable here; see homebrew_skip.txt for
        # the reason against each one.
        excluded=0
        skipfile="{{ playbook_dir }}/homebrew_skip.txt"
        skiplist=" "
        if [ -r "$skipfile" ]; then
          skiplist=" $(sed -e "s/#.*//" "$skipfile" | tr "\n" " ") "
        fi
        # Install in chunks for speed, then retry a failed chunk member by
        # member so one Linux-unavailable formula does not lose the other 24.
        # </dev/null is required: brew inherits stdin from the while loop,
        # which is the formulae file, and drains the remaining lines.
        flush() {
          [ -z "$chunk" ] && return 0
          if ! $brew_bin install $chunk >>"$log" 2>&1 </dev/null; then
            for f in $chunk; do
              if ! $brew_bin install "$f" >>"$log" 2>&1 </dev/null; then
                failed="$failed $f"
              fi
            done
          fi
          chunk=""
          n=0
        }
        while IFS= read -r formula || [ -n "$formula" ]; do
          formula="$(echo "$formula" | tr -d '[:space:]')"
          [ -z "$formula" ] && continue
          case "$formula" in \#*) continue ;; esac
          case "$installed" in
            *" $formula "*) skipped=$((skipped+1)); continue ;;
          esac
          case "$skiplist" in
            *" $formula "*) excluded=$((excluded+1)); continue ;;
          esac
          wanted=$((wanted+1))
          chunk="$chunk $formula"
          n=$((n+1))
          [ "$n" -ge 25 ] && flush
        done < "{{ playbook_dir }}/homebrew_formulae.txt"
        flush
        echo "SKIPPED:$skipped EXCLUDED:$excluded WANTED:$wanted"
        echo "POURED:$(grep -c "^==> Pouring" "$log")"
        [ -n "$failed" ] && echo "FAILED_FORMULAE:$failed"
        exit 0
      args:
        chdir: "{{ playbook_dir }}"
        executable: /bin/bash
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
        # Each brew invocation otherwise fires an analytics HTTP call and may
        # trigger a git auto-update fetch; both dominate runtime over hundreds
        # of installs.
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      register: brew_formulae
      changed_when: "'POURED:0' not in brew_formulae.stdout"

    - name: Report Homebrew formulae that failed to install
      debug:
        msg: >-
          {{ brew_formulae.stdout_lines | select('match', '^FAILED_FORMULAE:')
          | map('regex_replace', '^FAILED_FORMULAE:', '') | join(' ') | trim }}
          (see ~/brew-install.log)
      when: "'FAILED_FORMULAE:' in (brew_formulae.stdout | default(''))"

    # See roles/language_packages/tasks/main.yml. Homebrew's rust/go formulae
    # (see homebrew_formulae.txt) provide cargo/go by this point in the play.
    # lp_become_user runs cargo/go as the target user instead of root, the
    # same way the Homebrew tasks above use become_user.
    - name: Install cargo/go/pip packages from rust_packages.txt, go_packages.txt and python_packages.txt
      include_role:
        name: language_packages
      vars:
        lp_become_user: "{{ target_user }}"

    - name: Try install PostgreSQL 14 on Debian/Ubuntu
      apt:
        name: postgresql-14
        state: present
      when: ansible_facts.os_family == 'Debian'
      register: postgresql_14_install
      # ignore_errors, not failed_when: false -- the latter rewrites the
      # registered result to failed=false, so the `is failed` guard on the
      # fallback below could never be true and the fallback was dead code.
      ignore_errors: yes

    - name: Ensure default PostgreSQL is installed on Debian/Ubuntu if 14 is unavailable
      apt:
        name:
          - postgresql
          - postgresql-client
          - postgresql-contrib
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - postgresql_14_install is failed

    - name: Create user-local bin directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      loop:
        - "{{ target_home }}/.local/bin"
        - "{{ target_home }}/.local/share/man/man1"
        - "{{ target_home }}/.programs"
        - "{{ target_home }}/.logs"

    - name: Copy bash aliases
      copy:
        src: files/aliases
        dest: "{{ target_home }}/.aliases"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Copy bash history sqlite helper
      copy:
        src: files/bash-history-sqlite.sh
        dest: "{{ target_home }}/.bash-history-sqlite.sh"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    # copy, not template: the file contains ${#READLINE_LINE}, and Jinja reads
    # the {# as a comment opener and mangles the result. There are no template
    # variables in it, so there is nothing to render.
    # recentdirs (~/code/recentdirs), installed as `d`. Static musl binaries
    # are cross-built on the Mac and vendored here: neither box has a Rust
    # toolchain, and the source repo has no remote to clone from. Installed
    # per-user into ~/.local/bin rather than /usr/local/bin so no step of this
    # play needs root to place it, and so it works on a host where the user
    # cannot write to /usr/local.
    - name: Install the recentdirs binary as d
      copy:
        src: "files/bin/d-linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
        dest: "{{ target_home }}/.local/bin/d"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
        backup: yes

    # fasd (github.com/clvv/fasd, tag 1.0.1) -- an unmaintained single POSIX
    # shell script, vendored under files/fasd/ so the play never contacts
    # GitHub. Installed per-user next to d, for the same reason. The rc's fasd
    # init block (files/bashrc) activates it once it is on PATH.
    - name: Install fasd
      copy:
        src: files/fasd/fasd
        dest: "{{ target_home }}/.local/bin/fasd"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
        backup: yes

    - name: Install the fasd man page
      copy:
        src: files/fasd/fasd.1
        dest: "{{ target_home }}/.local/share/man/man1/fasd.1"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy portable bashrc
      copy:
        src: files/bashrc
        dest: "{{ target_home }}/.bashrc"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy portable bash_profile
      template:
        src: files/bash_profile.j2
        dest: "{{ target_home }}/.bash_profile"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    # roles/zsh/ and roles/starship/ are shared with wsl_playbook.yml the same
    # way roles/language_packages/ is. shell_owner makes the deployed files
    # land owned by the invoking user rather than root, since this play runs
    # with become: yes.
    - name: Deploy the portable zsh environment
      include_role:
        name: zsh
      vars:
        shell_owner: "{{ target_user }}"

    - name: Deploy the Starship prompt configuration
      include_role:
        name: starship
      vars:
        shell_owner: "{{ target_user }}"

    # default-command must name a bash that exists on this host, or every
    # new pane exits the instant it opens.
    - name: Look for a brewed bash for tmux to launch
      stat:
        path: "{{ homebrew_prefix }}/bin/bash"
      register: brew_bash

    - name: Select the tmux settings for this host
      set_fact:
        tmux_default_command: "{{ brew_bash.stat.exists | ternary(homebrew_prefix + '/bin/bash', '/bin/bash') }}"
        # This play installs vlock (see the package lists above), so the
        # config's own lock settings stand. wsl_playbook.yml cannot, and
        # overrides them.
        tmux_lock_command: vlock
        tmux_lock_after_time: 80

    - name: Deploy tmux configuration
      template:
        src: files/tmux.conf.j2
        dest: "{{ target_home }}/.tmux.conf"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    # ~/.vimrc turns on 'backup' and points backupdir/directory at these
    # paths; Vim aborts the write if they are missing.
    - name: Ensure vim backup directories exist
      file:
        path: "{{ target_home }}/{{ item }}"
        state: directory
        mode: '0700'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      loop:
        - .vim_backups
        - .vim/temp

    - name: Deploy vim configuration
      copy:
        src: files/vimrc
        dest: "{{ target_home }}/.vimrc"
        backup: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Ensure HISTDB exists
      file:
        path: "{{ target_home }}/.hist.db"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    # Vendored (files/bash-preexec.sh, upstream tag 0.7.0) rather than fetched:
    # the provisioned hosts cannot always reach raw.githubusercontent.com. To
    # update, re-download that path from a new tag and commit it.
    - name: Ensure bash-preexec helper is installed
      copy:
        src: files/bash-preexec.sh
        dest: "{{ target_home }}/.bash-preexec.sh"
        backup: yes
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Ensure SSH run directory exists
      file:
        path: /var/run/sshd
        state: directory
        mode: '0755'

    - name: Ensure ssh host keys are present
      command: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Ensure sshd listens on port 2222
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: '# {mark} ANSIBLE MANAGED PORT 2222'
        block: |
          Port 2222
          PasswordAuthentication yes
          PermitRootLogin prohibit-password
          UsePAM yes
          ChallengeResponseAuthentication no
      notify: restart sshd

    - name: Start and enable SSH service
      service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: yes

    # RHEL ships postgresql-server with an uninitialized data dir; the unit
    # refuses to start until postgresql-setup --initdb has run. Debian's
    # packaging creates a cluster on install, so this is RedHat-only.
    - name: Initialize PostgreSQL data directory on RedHat
      command: /usr/bin/postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION
      when: ansible_facts.os_family == 'RedHat'

    - name: Start PostgreSQL service
      service:
        name: postgresql
        state: started
        enabled: yes
      when: ansible_facts.os_family == 'Debian' or ansible_facts.os_family == 'RedHat'

    # Runs as root, whose PATH is /sbin:/bin:/usr/sbin:/usr/bin and excludes
    # /usr/local/bin where pip installs it -- so probe the paths explicitly or
    # this reinstalls ansible on every run.
    - name: Check whether ansible is already installed
      shell: command -v ansible-playbook || test -x /usr/local/bin/ansible-playbook
      register: ansible_present
      failed_when: false
      changed_when: false

    # The task below was named "if ansible is missing" but only gated on
    # os_family, so it ran on every play even when ansible was already present.
    - name: Install ansible package via pip if ansible is missing
      pip:
        name: ansible
        executable: /usr/bin/pip3
      when:
        - ansible_facts.os_family in ['Debian', 'RedHat']
        - ansible_present.rc != 0

  handlers:
    - name: restart sshd
      service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: restarted
